name: Build llama.cpp for Termux

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-in-termux:
    runs-on: ubuntu-latest
    container:
      image: termux/termux-docker:latest
      options: --user 1000 -e HOME=/data/data/com.termux/files/home

    steps:
    - name: Build and Package
      run: |
        # 1. Настройка окружения
        export HOME=/data/data/com.termux/files/home
        mkdir -p $HOME
        cd $HOME

        # 2. Обновление и установка пакетов
        pkg update -y && pkg upgrade -y
        pkg install -y cmake git ninja clang tar

        # 3. Клонирование репозитория llama.cpp
        git clone https://github.com/ggerganov/llama.cpp.git
        cd llama.cpp && git fetch --tags
        LLAMA_VER=$(git describe --tags --match "b*" --abbrev=0 2>/dev/null || git rev-parse --short HEAD)

        # 4. Сборка
        cmake -B build -G Ninja -DGGML_TESTS=OFF -DGGML_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_IS_DEV=OFF
        cmake --build build -j $(nproc) --target llama-cli llama-server

        # 5. Упаковка бинарников
        mkdir -p ../llama-bin
        cp build/bin/llama-cli ../llama-bin/
        cp build/bin/llama-server ../llama-bin/
        cd ..
        
        ARCHIVE_NAME="llama-${LLAMA_VER}-termux-arm64.tar.gz"
        tar -czvf "$ARCHIVE_NAME" llama-bin/
        
        # Копируем готовый архив в рабочую директорию Runner для шага релиза
        cp "$ARCHIVE_NAME" "$GITHUB_WORKSPACE/"

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        name: "Release ${{ github.ref_name }}"
        files: ${{ github.workspace }}/llama-*-termux-arm64.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
