name: Build llama.cpp for Termux

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-in-termux:
    runs-on: ubuntu-latest
    container:
      image: termux/termux-docker:latest
      # Запускаем от UID 1000 и переопределяем HOME для корректной работы pkg
      options: --user 1000 -e HOME=/data/data/com.termux/files/home

    steps:
    - name: Build and Package
      run: |
        # 1. Обновление окружения и установка зависимостей из вашего скрипта
        pkg update -y && pkg upgrade -y
        pkg install -y cmake git ninja clang tar

        # 2. Клонирование и получение оригинальной версии llama.cpp
        git clone https://github.com
        cd llama.cpp && git fetch --tags
        LLAMA_VER=$(git describe --tags --match "b*" --abbrev=0 2>/dev/null || git rev-parse --short HEAD)
        echo "LATEST_BUILD=$LLAMA_VER" >> $GITHUB_ENV

        # 3. Конфигурация и сборка по вашей схеме
        cmake -B build -G Ninja -DGGML_TESTS=OFF -DGGML_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_IS_DEV=OFF
        cmake --build build -j $(nproc) --target llama-cli llama-server

        # 4. Упаковка бинарников в архив
        mkdir ../llama-bin
        cp build/bin/llama-cli ../llama-bin/
        cp build/bin/llama-server ../llama-bin/
        cd .. && tar -czvf "llama-${LLAMA_VER}-termux-arm64.tar.gz" llama-bin/

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        name: "Release ${{ github.ref_name }} (llama.cpp ${{ env.LATEST_BUILD }})"
        files: llama-${{ env.LATEST_BUILD }}-termux-arm64.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
