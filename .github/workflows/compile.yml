name: Build llama.cpp for Termux ARM64

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-in-termux:
    runs-on: ubuntu-latest

    steps:
    # 1. Настройка QEMU для эмуляции архитектуры aarch64
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

    # 2. Запуск сборки в нативном ARM64 контейнере Termux
    - name: Build llama.cpp inside Termux ARM64 container
      run: |
        docker run --rm \
          --platform linux/arm64 \
          --user 1000 \
          -e HOME=/data/data/com.termux/files/home \
          -v ${{ github.workspace }}:/sdcard \
          termux/termux-docker:aarch64 bash -c "
            export HOME=/data/data/com.termux/files/home
            mkdir -p \$HOME
            cd \$HOME

            # Обновление и установка нативных пакетов ARM64
            pkg update -y && pkg upgrade -y
            pkg install -y cmake git ninja clang tar file

            # Клонирование
            git clone https://github.com/ggerganov/llama.cpp.git
            cd llama.cpp && git fetch --tags
            LLAMA_VER=\$(git describe --tags --match \"b*\" --abbrev=0 2>/dev/null || git rev-parse --short HEAD)

            # Нативная сборка под ARM64
            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DGGML_TESTS=OFF \
              -DGGML_EXAMPLES=OFF \
              -DLLAMA_BUILD_IS_DEV=OFF

            cmake --build build -j \$(nproc) --target llama-cli llama-server

            # Проверка формата итогового бинарника
            file build/bin/llama-cli

            # Упаковка
            mkdir -p ../llama-bin
            cp build/bin/llama-cli ../llama-bin/
            cp build/bin/llama-server ../llama-bin/
            cd ..
            
            ARCHIVE_NAME=\"llama-\${LLAMA_VER}-termux-arm64.tar.gz\"
            tar -czvf \"\$ARCHIVE_NAME\" llama-bin/
            
            # Копирование архива в монтированный workspace GitHub
            cp \"\$ARCHIVE_NAME\" /sdcard/
          "

    # 3. Публикация релиза
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        name: "Release ${{ github.ref_name }}"
        files: ${{ github.workspace }}/llama-*-termux-arm64.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
